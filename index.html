<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Faculty Records Auditor</title>
<style>
:root{
  color-scheme: light;
  --brand:#303090; --brand-strong:#24246f; --brand-wash:#ebebf7;
  --brand-2:#F07820; --brand-2-text:#A8500A; --brand-2-wash:#fdeee2;
  --page:#f6f6fb; --surface:#ffffff; --surface-2:#f0f0f6; --surface-3:#e6e6ef;
  --ink:#1b1b3a; --ink-2:#4a4c66; --ink-3:#6b6d85;
  --border:rgba(27,27,58,.11); --border-strong:rgba(27,27,58,.2);
  --good:#1e7b45; --good-wash:#e3f4ea;
  --empty:#9a6212; --empty-wash:#fbf0dc;
  --bad:#b42318; --bad-wash:#fde7e5;
  --neutral:#6b6d85; --neutral-wash:#ececf3;
  --shadow:0 1px 2px rgba(27,27,58,.05), 0 10px 30px -14px rgba(27,27,58,.22);
  --radius:14px;
  --font:"Tajawal", "Segoe UI", Tahoma, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --brand:#9d9df2; --brand-strong:#c3c3fa; --brand-wash:#22224a;
    --brand-2:#f5944a; --brand-2-text:#f5a463; --brand-2-wash:#3a2414;
    --page:#0f0f1c; --surface:#181829; --surface-2:#202034; --surface-3:#2a2a42;
    --ink:#eeeef8; --ink-2:#c2c3d8; --ink-3:#9a9cb6;
    --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.17);
    --good:#5ccf8c; --good-wash:#14301f;
    --empty:#e8b25c; --empty-wash:#33260f;
    --bad:#f2837a; --bad-wash:#3a1715;
    --neutral:#a5a7bf; --neutral-wash:#26263a;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --brand:#9d9df2; --brand-strong:#c3c3fa; --brand-wash:#22224a;
  --brand-2:#f5944a; --brand-2-text:#f5a463; --brand-2-wash:#3a2414;
  --page:#0f0f1c; --surface:#181829; --surface-2:#202034; --surface-3:#2a2a42;
  --ink:#eeeef8; --ink-2:#c2c3d8; --ink-3:#9a9cb6;
  --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.17);
  --good:#5ccf8c; --good-wash:#14301f;
  --empty:#e8b25c; --empty-wash:#33260f;
  --bad:#f2837a; --bad-wash:#3a1715;
  --neutral:#a5a7bf; --neutral-wash:#26263a;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 40px}
button,input,select{font-family:inherit}
.app{max-width:1200px;margin:0 auto}
.topbar{height:5px;margin-inline:-16px;background:linear-gradient(90deg,var(--brand) 0 72%,var(--brand-2) 72% 100%)}
[dir="rtl"] .topbar{background:linear-gradient(270deg,var(--brand) 0 72%,var(--brand-2) 72% 100%)}
header.hd{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-block:22px 18px}
.logo{height:56px;width:auto;flex:0 0 auto;background:#fff;border-radius:10px;padding:4px 8px}
.hd-text{flex:1 1 280px;min-width:0}
.hd-eyebrow{font-size:13px;font-weight:700;color:var(--brand-2-text);letter-spacing:.02em;margin:0}
.hd h1{margin:2px 0 0;font-size:26px;font-weight:800;color:var(--brand);line-height:1.25;text-wrap:balance}
.hd-sub{margin:4px 0 0;color:var(--ink-2);font-size:14px;max-width:70ch}
.hd-actions{display:flex;gap:8px;align-items:center}
.lang-btn{font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);cursor:pointer;min-height:40px}
.lang-btn:hover{border-color:var(--brand);color:var(--brand)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:22px;overflow-x:auto}
.tab{font-weight:700;font-size:15px;background:none;border:none;color:var(--ink-3);cursor:pointer;padding:12px 16px;border-bottom:3px solid transparent;white-space:nowrap;min-height:44px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand-2)}
.panel[hidden]{display:none!important}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.block{margin-bottom:28px}
.block-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.block h2{margin:0;font-size:18px;font-weight:800;color:var(--ink)}
.desc{color:var(--ink-2);font-size:14px;margin:0 0 12px;max-width:75ch}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.step-lbl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--ink);margin-bottom:8px}
.step-num{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:0 0 auto}
input[type=text],input[type=search],select{width:100%;font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);min-height:44px}
input:focus-visible,select:focus-visible,button:focus-visible,.upload:focus-within{outline:2px solid var(--brand-2);outline-offset:2px}
.upload-row{display:flex;flex-wrap:wrap;gap:8px}
.upload{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:10px 16px;border-radius:10px;border:1px dashed var(--brand);background:var(--brand-wash);color:var(--brand);cursor:pointer;min-height:44px}
.upload:hover{background:var(--surface)}
.upload input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.chip{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:6px 10px;display:inline-block;margin-top:8px}
.hint{font-size:13px;color:var(--ink-3);margin:8px 0 0}
.btn{font-weight:800;font-size:15px;padding:11px 22px;border-radius:10px;border:none;background:var(--brand);color:#fff;cursor:pointer;min-height:44px}
.btn:hover:not(:disabled){background:var(--brand-strong)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-2{font-weight:700;font-size:14px;padding:9px 16px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);cursor:pointer;min-height:42px;display:inline-flex;align-items:center;gap:8px}
.btn-2:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.btn-2:disabled{opacity:.45;cursor:not-allowed}
.btn-2.accent{border-color:var(--brand-2);color:var(--brand-2-text);background:var(--brand-2-wash)}
.link-btn{background:none;border:none;color:var(--brand);font-weight:700;font-size:14px;cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.status{font-size:14px;padding:10px 14px;border-radius:10px;margin-top:12px}
.status.info{background:var(--brand-wash);color:var(--brand)}
.status.error{background:var(--bad-wash);color:var(--bad)}
.status.ok{background:var(--good-wash);color:var(--good)}
.demo-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--brand-2-wash);color:var(--brand-2-text);border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;margin-bottom:18px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:24px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.tile .lbl{font-size:13px;color:var(--ink-3);font-weight:700}
.tile .val{font-size:28px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .sub{font-size:12.5px;color:var(--ink-2)}
.tile.good .val{color:var(--good)} .tile.empty .val{color:var(--empty)} .tile.bad .val{color:var(--bad)} .tile.brand .val{color:var(--brand)}

.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
.filters .f{display:flex;flex-direction:column;gap:4px;flex:1 1 150px;min-width:0}
.filters .f.grow{flex:2 1 220px}
.filters label{font-size:12.5px;font-weight:700;color:var(--ink-3)}
.count{font-size:13px;color:var(--ink-3);margin-inline-start:auto;align-self:center}

.item-bars{display:flex;flex-direction:column;gap:2px}
.ib{display:grid;grid-template-columns:minmax(150px,240px) 1fr 132px;gap:12px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--border)}
.ib:last-child{border-bottom:none}
.ib .nm{font-size:13.5px;color:var(--ink);font-weight:600;min-width:0}
.ib .nm small{display:block;color:var(--ink-3);font-weight:500;font-size:12px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-3);gap:2px}
.stack span{display:block;height:100%}
.stack .a{background:var(--good)} .stack .e{background:var(--empty)}
.ib .v{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:end}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-wash);color:var(--good)}
.pill.empty{background:var(--empty-wash);color:var(--empty)}
.pill.bad{background:var(--bad-wash);color:var(--bad)}
.pill.neutral{background:var(--neutral-wash);color:var(--neutral)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:6px;background:var(--surface-3);color:var(--ink-2);margin-inline-start:6px;vertical-align:1px}

.tbl-wrap{overflow-x:auto}
table.units{width:100%;border-collapse:collapse;min-width:720px}
table.units th{text-align:start;font-size:12.5px;color:var(--ink-3);font-weight:700;padding:10px;border-bottom:1px solid var(--border-strong);white-space:nowrap}
table.units td{padding:10px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
tr.grp td{background:var(--brand-wash);color:var(--brand);font-weight:800;font-size:13.5px;padding:8px 12px}
tr.unit{cursor:pointer}
tr.unit:hover td{background:var(--surface-2)}
tr.unit .chev{display:inline-block;transition:transform .15s;color:var(--ink-3);margin-inline-end:6px}
[dir="rtl"] tr.unit .chev{transform:scaleX(-1)}
tr.unit.open .chev{transform:rotate(90deg)}
.course-nm{font-weight:700}
.muted{color:var(--ink-3);font-size:13px}
.prog{display:flex;align-items:center;gap:8px}
.prog-t{width:90px;height:8px;border-radius:5px;background:var(--surface-3);overflow:hidden;display:flex}
.prog-t span{height:100%}
.prog-n{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.counts{display:flex;gap:6px;flex-wrap:wrap}
tr.detail[hidden]{display:none}
tr.detail td{padding:0;background:var(--surface-2)}
.detail-in{padding:16px 18px 20px}
.detail-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
table.chk{width:100%;border-collapse:collapse;min-width:680px}
table.chk td{padding:8px;font-size:13.5px;border-bottom:1px dashed var(--border);vertical-align:top}
table.chk td.n{color:var(--ink-3);width:28px;font-variant-numeric:tabular-nums}
table.chk td.nm{width:250px;font-weight:700}
table.chk td.nm small{display:block;font-weight:500;color:var(--ink-3);font-size:12px}
table.chk td.st{width:150px}
.file{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:4px}
.file .fn{color:var(--ink);word-break:break-word}
.ai-btn{font-size:12px;font-weight:700;padding:3px 9px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);color:var(--brand);cursor:pointer;min-height:28px}
.ai-btn:disabled{opacity:.5;cursor:default}
.ai-out{font-size:12.5px;margin-top:2px;color:var(--ink-2)}
.guide{margin-top:6px;font-size:13px;color:var(--ink-2);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.guide b{color:var(--ink)}
.guide .tpl{color:var(--brand-2-text);font-weight:700}
.other{font-size:13px;color:var(--ink-2);margin-top:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}

.export-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.hist-tbl{width:100%;border-collapse:collapse;min-width:560px}
.hist-tbl th{text-align:start;font-size:12.5px;color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--border-strong)}
.hist-tbl td{padding:8px 10px;border-bottom:1px solid var(--border);font-size:14px;font-variant-numeric:tabular-nums}
.delta-up{color:var(--good);font-weight:800} .delta-down{color:var(--bad);font-weight:800} .delta-0{color:var(--ink-3)}

.heat{border-collapse:collapse;width:100%;min-width:560px}
.heat th,.heat td{padding:7px 8px;font-size:13px;text-align:center;border-bottom:1px solid var(--border)}
.heat th{color:var(--ink-2);font-weight:700;font-size:12.5px}
.heat td.lb{text-align:start;font-weight:600;white-space:nowrap}
.cell{display:inline-flex;justify-content:center;min-width:52px;padding:4px;border-radius:6px;font-weight:800;font-variant-numeric:tabular-nums}
.college-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.college-card{cursor:pointer;text-align:start;font:inherit;color:inherit;width:100%}
.college-card[aria-pressed="true"]{outline:2px solid var(--brand-2)}
.college-card h3{margin:0 0 4px;font-size:16px}
.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--border);font-size:13px;color:var(--ink-3);max-width:90ch}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border-strong);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-inline-end:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;color:var(--ink-2);padding:28px 16px}
.empty-state b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:640px){
  .hd h1{font-size:21px}
  .logo{height:46px}
  .ib{grid-template-columns:1fr;gap:4px}
  .ib .v{text-align:start}
}
</style>

/* ===================== MATCHING ===================== */
function norm(s){ return s.toLowerCase().replace(/\.[a-z0-9]{2,5}$/,"").replace(/[^a-z0-9]+/g," ").trim(); }
function matchItem(fname){
  const n = norm(fname), t = new Set(n.split(" ").filter(Boolean)), raw = fname.toLowerCase();
  const has = (...w)=>w.every(x=>t.has(x));
  const any = (...w)=>w.some(x=>t.has(x));
  const stu = any("student","students");
  const m = new Set();
  if(has("academic","calendar") || t.has("acf") || /تقويم\s*أكاديمي|التقويم الأكاديمي/.test(raw)) m.add(1);
  if(any("coordinator","coordinators") && !stu && (t.has("list")||t.has("courses")||t.has("course"))) m.add(2);
  if(any("committee","committe") || /لجنة/.test(raw)) m.add(3);
  if(has("course","profile") || t.has("profile") || /توصيف/.test(raw)) m.add(4);
  if(has("time","table") || t.has("timetable") || /جدول/.test(raw)) m.add(5);
  if(any("coordinator","coordinators") && stu) m.add(6);
  if(any("lesson","lessons") && any("plan","plans") || /خطة\s*(الدرس|المحاضرة)|خطط/.test(raw)) m.add(7);
  if(t.has("seminar") || /سمنار|سيمنار/.test(raw)) m.add(8);
  if(t.has("formative") || /تقويم\s*مستمر|التقويم المستمر/.test(raw)) m.add(9);
  if(has("log","sheet") || has("instructor","log") || /سجل\s*المحاضر/.test(raw)) m.add(10);
  if(t.has("payment") || /اتفاقية|أتعاب/.test(raw)) m.add(11);
  if(any("attendance","attendence","attendace") || /حضور/.test(raw)) m.add(12);
  if(has("course","evaluation") || (t.has("evaluation") && t.has("report") && !t.has("seminar")) || /تقييم\s*المقرر/.test(raw)) m.add(13);
  if(t.has("moderation") || has("post","assessment") || /مراجعة\s*التقويم/.test(raw)) m.add(14);
  if(any("result","results","grades","marks") || /نتائج|النتيجة/.test(raw)) m.add(15);
  if(has("final","report") || /التقرير\s*(النهائي|الختامي)/.test(raw)) m.add(16);
  if(m.has(16) && m.has(13) && !has("course","evaluation")) m.delete(13);
  return [...m];
}
function isEmptyFile(size){ return typeof size==="number" && (size < TINY_BYTES || BLANK_TEMPLATE_SIZES.has(size)); }

/* ===================== PATH CONTEXT ===================== */
function ctxOf(parts){
  let batch=null, sem=null, track=null;
  for(const p of parts){
    const lp = p.toLowerCase();
    let m;
    if(!batch && (m = lp.match(/batch\s*[-_ ]?\s*(\d+)/) || p.match(/(?:باتش|الدفعة|دفعة)\s*(\d+)/))) batch = "Batch "+m[1];
    if(!sem && (m = lp.match(/se?m[ea]?s?ter\s*[-_ ]?\s*(\d+)/) || p.match(/(?:سمستر|السمستر|الفصل)\s*(\d+)/) || lp.match(/^sem\s*[-_ ]?(\d+)$/))) sem = "Semester "+m[1];
    if(!track && /^(cs|it|is|se|ce|ds)$/i.test(p.trim())) track = p.trim().toUpperCase();
  }
  return { batch, sem, track };
}

/* ===================== BUILD REPORT ===================== */
function buildReport(files, extraDirs){
  const dirFiles = new Map();     // dir -> files directly inside
  const allDirs = new Set(extraDirs||[]);
  const general = [];
  for(const f of files){
    const parts = f.path.split("/").filter(Boolean);
    if(parts.length<=1){ general.push(f); continue; }
    const dir = parts.slice(0,-1).join("/");
    if(!dirFiles.has(dir)) dirFiles.set(dir,[]);
    dirFiles.get(dir).push({ name:parts[parts.length-1], size:f.size, file:f.file, zipEntry:f.zipEntry, demo:f.demo });
    for(let i=1;i<parts.length;i++) allDirs.add(parts.slice(0,i).join("/"));
  }
  const dirs = [...allDirs];
  const hasDesc = d => dirs.some(x=>x!==d && x.startsWith(d+"/"));
  const descHasFiles = d => [...dirFiles.keys()].some(x=>x!==d && x.startsWith(d+"/"));
  // course units = dirs with files and no file-bearing sub-dirs, plus empty leaf dirs that sit inside a recognised batch/semester/track
  const unitDirs = dirs.filter(d=>{
    if(dirFiles.has(d)) return !descHasFiles(d);
    if(hasDesc(d)) return false;
    const c = ctxOf(d.split("/"));
    return !!(c.batch||c.sem||c.track) && d.split("/").length>=2;
  });
  // files in container dirs are shared with the courses below them
  const shared = [];
  for(const [d,fl] of dirFiles){ if(descHasFiles(d)) fl.forEach(f=>shared.push({dir:d, f})); }

  const units = unitDirs.map(dir=>{
    const parts = dir.split("/");
    const own = dirFiles.get(dir)||[];
    const items = {}; IDS.forEach(i=>items[i]={status:"missing",files:[],shared:false});
    const matched = new Set();
    own.forEach(fl=>{
      matchItem(fl.name).forEach(id=>{
        const empty = isEmptyFile(fl.size);
        const it = items[id];
        if(!empty) it.status = "available"; else if(it.status==="missing") it.status = "empty";
        it.files.push({...fl, empty});
        matched.add(fl.name);
      });
    });
    shared.filter(s=>dir.startsWith(s.dir+"/")).forEach(s=>{
      matchItem(s.f.name).forEach(id=>{
        const it = items[id]; const empty = isEmptyFile(s.f.size);
        if(it.status==="missing" || (it.status==="empty" && !empty)){
          it.status = empty ? "empty" : "available"; it.shared = !empty;
        }
        it.files.push({...s.f, empty, sharedFrom:s.dir});
      });
    });
    const c = ctxOf(parts);
    const nA = IDS.filter(i=>items[i].status==="available").length;
    const nE = IDS.filter(i=>items[i].status==="empty").length;
    return { dir, course:parts[parts.length-1], path:parts.slice(0,-1).join(" / "),
      batch:c.batch, sem:c.sem, track:c.track, items,
      other: own.filter(f=>!matched.has(f.name)), nFiles:own.length, emptyFolder: own.length===0,
      nA, nE, nM:16-nA-nE, pct:pct(nA,16) };
  });
  const key = u => [u.sem||"~", u.batch||"~", u.track||"~", u.course].join("|");
  units.sort((a,b)=> key(a).localeCompare(key(b), undefined, {numeric:true}));
  return { units, general };
}

function filtered(){
  if(!report) return [];
  const q = filt.q.trim().toLowerCase();
  return report.units.filter(u=>
    (filt.batch==="*" || (u.batch||"")===filt.batch) &&
    (filt.sem==="*" || (u.sem||"")===filt.sem) &&
    (filt.track==="*" || (u.track||"")===filt.track) &&
    (!q || u.course.toLowerCase().includes(q) || u.path.toLowerCase().includes(q)));
}
function statsOf(units){
  const s = { n:units.length, a:0, e:0, m:0, uncl:0, per:{} };
  IDS.forEach(i=>s.per[i]={a:0,e:0});
  units.forEach(u=>{ s.a+=u.nA; s.e+=u.nE; s.m+=u.nM; s.uncl+=u.other.length;
    IDS.forEach(i=>{ const st=u.items[i].status; if(st==="available") s.per[i].a++; else if(st==="empty") s.per[i].e++; }); });
  s.avg = units.length ? units.reduce((x,u)=>x+u.pct,0)/units.length : 0;
  return s;
}

function status(kind,msg){ const el=$("scan-status"); if(el) el.innerHTML = msg ? `<div class="status ${kind}">${kind==="info"?'<span class="spin"></span>':""}${esc(msg)}</div>` : ""; }
function stage(files, dirs, source){

  pending = { files, dirs, source };
  const chip = $("chip"); chip.hidden = false; chip.textContent = t("filesReady")(files.length, source);
  $("go").disabled = false; status("", "");
}
async function readZip(file){
  if(!file) return;
  status("info", t("readingZip"));
  try{
    const zip = await JSZip.loadAsync(file);
    const files=[], dirs=[];
    Object.values(zip.files).forEach(en=>{
      if(en.dir){ dirs.push(en.name.replace(/\/$/,"")); return; }
      if(/(^|\/)(__MACOSX|\.DS_Store|Thumbs\.db|~\$)/.test(en.name)) return;

    });

}

/* ===================== AI CHECK ===================== */
function findFile(k){
  const [dir, iStr] = k.split("::");
  const u = report.units.find(x=>x.dir===dir); if(!u) return null;
  const f = u.items[Number(iStr)].files.find(f=>fileKey(u,Number(iStr),f)===k);
  return f ? { u, i:Number(iStr), f } : null;
}
async function blobOf(f){ return f.file || (f.zipEntry ? await f.zipEntry.async("blob") : null); }
async function textOf(f){
  const b = await blobOf(f); if(!b) throw new Error("no data");
  if(/\.docx$/i.test(f.name)){
    const z = await JSZip.loadAsync(b); const d = z.file("word/document.xml"); if(!d) throw new Error("docx");
    return { text:(await d.async("string")).replace(/<w:p[ >]/g," \n<w:p ").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim().slice(0,3500) };
  }
  if(/\.pdf$/i.test(f.name)){
    if(typeof pdfjsLib==="undefined") throw new Error("PDF");
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js";
    const pdf = await pdfjsLib.getDocument({data: await b.arrayBuffer()}).promise;
    let s=""; for(let p=1;p<=Math.min(pdf.numPages,3);p++){ const c=await (await pdf.getPage(p)).getTextContent(); s+=c.items.map(x=>x.str).join(" ")+" "; if(s.length>3500) break; }
    return { text:s.trim().slice(0,3500) };
  }
  // legacy .doc: pull readable UTF-16LE runs (incl. Arabic) and 8-bit ASCII runs
  const u8 = new Uint8Array(await b.arrayBuffer());
  const runs16=[], runs8=[]; let cur="";
  for(let i=0;i+1<u8.length;i+=2){
    const code = u8[i] | (u8[i+1]<<8);
    const ok = (code>=32&&code<127) || (code>=0x0600&&code<=0x06FF) || code===10 || code===13;
    if(ok) cur += String.fromCharCode(code); else { if(cur.trim().length>=6) runs16.push(cur); cur=""; }
  }
  if(cur.trim().length>=6) runs16.push(cur); cur="";
  for(let i=0;i<u8.length;i++){ const c=u8[i]; if(c>=32&&c<127) cur+=String.fromCharCode(c); else { if(cur.length>=8 && /[a-z]{3}/i.test(cur)) runs8.push(cur); cur=""; } }
  const a = runs16.join(" "), c = runs8.join(" ");
  return { text:(a.length>=c.length?a:c).replace(/\s+/g," ").trim().slice(0,3500), doc:true };
}
async function aiOne(k){
  const hit = findFile(k); if(!hit || !caps.sample) return;
  aiResults[k] = {state:"run"}; renderBody();
  try{
    const { text, doc } = await textOf(hit.f);
    if(!text || text.length<20) throw new Error(t("aiNoText"));
    const v = await caps.sample.json(`A university course-records checklist (British Accreditation Council) requires a document called "${itemName(hit.i)}". The file "${hit.f.name}" was submitted for it. Text extracted from the file follows (it may be partial or garbled):\n"""${text}"""\nDoes the content really look like a "${itemName(hit.i)}" that has been filled in (not a blank template)? Reply with ONLY JSON: {"matches": true|false, "confidence": "high"|"medium"|"low", "reason": "one short sentence in ${lang==="ar"?"Arabic":"English"}"}`, { modelTier:"quick" });
    aiResults[k] = { state: v && v.matches ? "yes" : "no", conf: v && v.confidence, text: v && v.reason, doc };
  }catch(err){ aiResults[k] = { state:"err", text: (err && (err.message||err.code)) || String(err) }; }
  renderBody();
}
async function aiAll(dir){
  const u = report.units.find(x=>x.dir===dir); if(!u || !caps.sample) return;
  const keys = []; IDS.forEach(i=>u.items[i].files.filter(canAi).forEach(f=>keys.push(fileKey(u,i,f))));
  let done = 0;
  for(const k of keys){
    if(!(aiResults[k] && (aiResults[k].state==="yes"||aiResults[k].state==="no"))) await aiOne(k);
    done++; const pe = document.getElementById("prog-"+slug(dir)); if(pe) pe.textContent = t("aiProg")(done, keys.length);
  }
}

function histRecord(){
  const s = statsOf(report.units);
  return { college:report.college, key:slug(report.college), at:report.at, n:s.n, avg:Number(s.avg.toFixed(1)), a:s.a, e:s.e, m:s.m,
    per:Object.fromEntries(IDS.map(i=>[i, s.per[i].a])) };
}
function localHist(){ try{ return JSON.parse(localStorage.getItem("cra-history")||"[]"); }catch(e){ return []; } }
async function saveHistory(){
  const rec = histRecord();
  if(caps.db){
    try{ await caps.db.collection("history").add(rec); histStore="db"; return; }catch(e){ /* fall back below */ }
  }
  try{ const h = localHist(); h.push(rec); localStorage.setItem("cra-history", JSON.stringify(h.slice(-200))); histStore="local"; }catch(e){}
}
async function loadHistory(){
  let rows = [];
  if(caps.db){
    try{ const snap = await caps.db.collection("history").get(); rows = snap.docs.map(d=>d.data()).filter(Boolean); histStore="db"; }catch(e){ rows = []; }
  }
  if(!rows.length){ rows = localHist(); if(rows.length) histStore="local"; }
  return rows;
}
async function renderHistory(){
  const p = $("panel-history");
  p.innerHTML = `<div class="card empty-state"><span class="spin"></span></div>`;
  const rows = await loadHistory();
  if(!rows.length){ p.innerHTML = `<div class="card empty-state"><b>${esc(t("histEmpty"))}</b>${esc(t("histEmptySub"))}</div>`; return; }
  const by = new Map();
  rows.forEach(r=>{ if(!by.has(r.key)) by.set(r.key,[]); by.get(r.key).push(r); });
  let h = `<section class="block"><div class="block-h"><h2>${esc(t("histH"))}</h2><span class="muted">${esc(histStore==="db"?t("histShared"):t("histLocal"))}</span></div><p class="desc">${esc(t("histD"))}</p>`;
  by.forEach(list=>{
    list.sort((a,b)=> String(a.at).localeCompare(String(b.at)));
    const last = list[list.length-1], prev = list.length>1 ? list[list.length-2] : null;
    const d = prev ? Math.round((last.avg-prev.avg)*10)/10 : null;
    h += `<div class="card block"><div class="block-h"><h2>${esc(last.college)}</h2>${d!==null?`<span class="${d>0?"delta-up":d<0?"delta-down":"delta-0"}">${d>0?"+":""}${d}%</span>`:""}</div>
      <div class="tbl-wrap"><table class="hist-tbl"><thead><tr><th>${esc(t("histWhen"))}</th><th>${esc(t("histN"))}</th><th>${esc(t("histAvg"))}</th><th>${esc(t("histA"))}</th><th>${esc(t("histE"))}</th><th>${esc(t("histM"))}</th></tr></thead><tbody>`;
    list.slice(-6).reverse().forEach(r=> h += `<tr><td>${esc(fmtDate(r.at))}</td><td>${r.n}</td><td>${r.avg}%</td><td>${r.a}</td><td>${r.e}</td><td>${r.m}</td></tr>`);
    h += `</tbody></table></div>`;
    if(prev){
      const ch = IDS.filter(i=>(last.per[i]||0)!==(prev.per[i]||0));
      if(ch.length){
        h += `<p class="desc" style="margin-top:14px">${esc(t("histDelta"))}</p><div class="tbl-wrap"><table class="hist-tbl"><thead><tr><th>${esc(t("histItem"))}</th><th>${esc(t("histPrev"))}</th><th>${esc(t("histNow"))}</th><th></th></tr></thead><tbody>`;
        ch.forEach(i=>{ const a=prev.per[i]||0, b=last.per[i]||0, dd=b-a; h += `<tr><td><bdi>${i}. ${esc(itemName(i))}</bdi></td><td>${a}</td><td>${b}</td><td class="${dd>0?"delta-up":"delta-down"}">${dd>0?"+":""}${dd}</td></tr>`; });
        h += `</tbody></table></div>`;
      }
    }else h += `<p class="desc" style="margin-top:12px">${esc(t("histOnly"))}</p>`;
    h += `</div>`;
  });
  h += `</section>`;
  p.innerHTML = h;
}

/* ===================== OFFICE DASHBOARD ===================== */
let officeLoaded = false;
function bucketColor(p){ return p>=60?["var(--good)","var(--good-wash)"]:p>=25?["var(--empty)","var(--empty-wash)"]:["var(--bad)","var(--bad-wash)"]; }
async function renderOffice(){
  const p = $("panel-office");
  if(!caps.db){ p.innerHTML = `<div class="card empty-state"><b>${esc(t("offH"))}</b>${esc(t("offOff"))}</div>`; return; }
  p.innerHTML = `<div class="card empty-state"><span class="spin"></span>${esc(t("offLoading"))}</div>`;
  let cols = [];
  try{ cols = (await caps.db.collection("submissions").get()).docs.map(d=>d.data()).filter(Boolean); }
  catch(err){ p.innerHTML = `<div class="card status error">${esc((err&&(err.message||err.code))||err)}</div>`; return; }
  if(!cols.length){ p.innerHTML = `<div class="card empty-state"><b>${esc(t("offEmpty"))}</b>${esc(t("offEmptySub"))}</div>`; return; }
  cols.sort((a,b)=>(b.avgPct||0)-(a.avgPct||0));
  const tu = cols.reduce((s,c)=>s+(c.totalUnits||0),0), avg = cols.reduce((s,c)=>s+(c.avgPct||0),0)/cols.length;
  let h = `<div class="tiles"><div class="tile brand"><div class="lbl">${esc(t("offCols"))}</div><div class="val">${cols.length}</div></div>
    <div class="tile"><div class="lbl">${esc(t("offUnits"))}</div><div class="val">${tu}</div></div>
    <div class="tile ${avg<25?"bad":avg<60?"empty":"good"}"><div class="lbl">${esc(t("offAvg"))}</div><div class="val">${avg.toFixed(1)}%</div></div></div>`;
  h += `<section class="block"><div class="block-h"><h2>${esc(t("offRank"))}</h2></div><div class="card"><div class="item-bars">`;
  cols.forEach(c=>{ const v=c.avgPct||0; h += `<div class="ib"><div class="nm"><bdi>${esc(c.collegeName)}</bdi>${c.demo?`<span class="tag">${esc(t("demoTag"))}</span>`:""}<small>${c.totalUnits||0} ${esc(t("units"))}</small></div><div class="stack"><span class="a" style="width:${v}%;background:${bucketColor(v)[0]}"></span></div><div class="v">${v.toFixed(1)}%</div></div>`; });
  h += `</div></div></section>`;
  h += `<section class="block"><div class="block-h"><h2>${esc(t("offHeat"))}</h2></div><p class="desc">${esc(t("offHeatD"))}</p><div class="card tbl-wrap"><table class="heat"><thead><tr><th style="text-align:start">${esc(t("histItem"))}</th>${cols.map(c=>`<th><bdi>${esc(c.collegeName)}</bdi></th>`).join("")}</tr></thead><tbody>`;
  IDS.forEach(i=>{ h += `<tr><td class="lb"><bdi>${i}. ${esc(itemName(i))}</bdi></td>`; cols.forEach(c=>{ const v = c.totalUnits ? Math.round(((c.itemCount&&c.itemCount[i])||0)/c.totalUnits*100) : 0; const [fg,bg]=bucketColor(v); h += `<td><span class="cell" style="color:${fg};background:${bg}">${v}%</span></td>`; }); h += `</tr>`; });
  h += `</tbody></table></div></section>`;
  h += `<section class="block"><div class="block-h"><h2>${esc(t("offDetail"))}</h2></div><div class="college-grid" id="cc"></div><div id="cd" style="margin-top:14px"></div></section>`;
  p.innerHTML = h;
  const cc = $("cc");
  cols.forEach((c,ix)=>{
    const b = document.createElement("button"); b.type="button"; b.className="card college-card"; b.setAttribute("aria-pressed", ix===0?"true":"false");
    b.innerHTML = `<h3><bdi>${esc(c.collegeName)}</bdi>${c.demo?`<span class="tag">${esc(t("demoTag"))}</span>`:""}</h3><div class="muted">${c.totalUnits||0} ${esc(t("units"))} · ${esc(t("avg"))} ${(c.avgPct||0).toFixed(1)}% · ${esc(fmtDate(c.submittedAt))}</div>`;
    b.addEventListener("click", ()=>{ cc.querySelectorAll(".college-card").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); detail(c); });
    cc.appendChild(b);
  });
  function detail(c){
    let d = `<div class="card" style="padding:0"><div class="tbl-wrap"><table class="units"><thead><tr><th>${esc(t("thCourse"))}</th><th>${esc(t("fBatch"))}</th><th>${esc(t("fSem"))}</th><th>${esc(t("thTrack"))}</th><th>${esc(t("thDone"))}</th></tr></thead><tbody>`;
    (c.units||[]).forEach(u=>{ d += `<tr><td><bdi class="course-nm">${esc(u.name)}</bdi></td><td>${esc(u.batch||"–")}</td><td>${esc(u.sem||"–")}</td><td>${esc(u.track||"–")}</td><td><div class="prog"><div class="prog-t"><span style="width:${(u.nAvail||0)/16*100}%;background:var(--good)"></span><span style="width:${(u.nEmpty||0)/16*100}%;background:var(--empty)"></span></div><span class="prog-n">${u.nAvail||0}/16</span></div></td></tr>`; });
    d += `</tbody></table></div></div>`; $("cd").innerHTML = d;
  }
  detail(cols[0]);
  officeLoaded = true;
}

/* ===================== TABS + INIT ===================== */
function showTab(name){
  activeTab = name;
  document.querySelectorAll(".tab").forEach(b=> b.setAttribute("aria-selected", b.dataset.tab===name?"true":"false"));
  ["scan","history","office"].forEach(n=> $("panel-"+n).hidden = n!==name);
  if(name==="history") renderHistory();
  if(name==="office") renderOffice();
}
document.querySelectorAll(".tab").forEach(b=> b.addEventListener("click", ()=>showTab(b.dataset.tab)));
$("lang-btn").addEventListener("click", ()=>{
  lang = lang==="ar"?"en":"ar";
  try{ localStorage.setItem("cra-lang", lang); }catch(e){}
  renderChrome(); renderScan();
  if(activeTab!=="scan") showTab(activeTab);
});

renderChrome();
renderScan();

(async function(){
  if(!(window.claude && typeof window.claude.use==="function")) return;
  const get = async n=>{ try{ return await window.claude.use(n); }catch(e){ return null; } };
  const [db, sample, downloads] = await Promise.all([get("db"), get("sample"), get("downloads")]);
  caps = { db, sample, downloads };
  if(report) renderBody();
  if(activeTab!=="scan") showTab(activeTab);
})();

window.__CRA_TEST__ = { matchItem, buildReport, ctxOf, isEmptyFile };
})();

</script>
